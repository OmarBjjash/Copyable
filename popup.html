<!-- popup.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copyable</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="brand">
          <div class="logo">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path
                d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
              ></path>
            </svg>
          </div>
          <div class="title-group">
            <h1>Copyable</h1>
            <span class="version">v2.7</span>
          </div>
        </div>
      </header>

      <main class="content">
        <div class="card toggle-card">
          <div class="toggle-info">
            <span class="toggle-title">Extension Status</span>
            <span class="toggle-subtitle">Enable or disable unblocking</span>
          </div>
          <label class="switch" for="toggle-extension">
            <input type="checkbox" id="toggle-extension" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="card status-card">
          <div class="status-header">
            <span class="status-label">Current Tab</span>
            <span id="status-badge" class="badge badge-active">Active</span>
          </div>
          <div id="current-domain" class="domain-text">Detecting site...</div>
          <p id="status-text" class="status-description">
            Unblocking right-click and text selection on this page.
          </p>
        </div>

        <div class="features-list">
          <div class="feature-item">
            <svg
              class="check-icon"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Context Menu Unblocked</span>
          </div>
          <div class="feature-item">
            <svg
              class="check-icon"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Text Selection Enabled</span>
          </div>
          <div class="feature-item">
            <svg
              class="check-icon"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Shadow DOM Protection Pierced</span>
          </div>
        </div>
      </main>

      <footer class="footer">
        <span>Changes apply in real-time across open tabs</span>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
